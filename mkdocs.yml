site_name: DecisionGraph
site_description: Event-sourced decision audit trail for AI agents.
site_url: https://aliuyar1234.github.io/DecisionGraph/
repo_url: https://github.com/aliuyar1234/DecisionGraph
repo_name: aliuyar1234/DecisionGraph

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Showcase: showcase.md
  - Quickstart: quickstart.md
  - API:
      - Overview: api.md
      - BEAM Service API: api/BEAM_SERVICE_API.md
  - V1 Contracts: v1-contracts.md
