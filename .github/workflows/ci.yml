name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decisiongraph
          POSTGRES_PASSWORD: decisiongraph
          POSTGRES_DB: decisiongraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U decisiongraph -d decisiongraph_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      PG_CONNINFO: "host=localhost port=5432 dbname=decisiongraph_test user=decisiongraph password=decisiongraph"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra postgres
      - run: uv run ruff check src
      - run: uv run mypy src
      - run: uv run lint-imports
      - run: uv run pytest --cov=decisiongraph --cov-branch --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
