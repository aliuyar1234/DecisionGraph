name: SBOM

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: anchore/sbom-action@v0
        with:
          output-file: sbom.spdx.json
          format: spdx-json
      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.spdx.json
