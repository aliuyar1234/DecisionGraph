name: Demo

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run python demo/run_demo.py --output demo-output.md
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: demo-output.md
