name: BEAM

on:
  push:
  pull_request:

jobs:
  beam-check:
    name: Elixir Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decisiongraph
          POSTGRES_PASSWORD: decisiongraph
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decisiongraph -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: beam
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.2"
      - uses: actions/cache@v5
        with:
          path: |
            beam/deps
            beam/_build
          key: ${{ runner.os }}-beam-${{ hashFiles('beam/mix.lock', 'beam/mix.exs', 'beam/apps/**/mix.exs') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix do --app dg_store ecto.setup
        env:
          MIX_ENV: test
      - name: Projector parity proof
        run: mix test apps/dg_projector/test/decision_graph/projector/parity_test.exs
        env:
          MIX_ENV: test
      - name: Authenticated service E2E proof
        run: mix test apps/dg_web/test/decision_graph_web/controllers/api_service_e2e_test.exs
        env:
          DG_RUN_SERVICE_E2E: "1"
          MIX_ENV: test
      - name: Umbrella test suite
        run: mix test
        env:
          DG_RUN_SERVICE_E2E: "1"
          MIX_ENV: test

  beam-dialyzer:
    name: Elixir Dialyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beam
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.2"
      - uses: actions/cache@v5
        with:
          path: |
            beam/deps
            beam/_build
            beam/*.plt
            beam/*.plt.hash
          key: ${{ runner.os }}-beam-dialyzer-${{ hashFiles('beam/mix.lock', 'beam/mix.exs', 'beam/apps/**/mix.exs') }}
      - run: mix deps.get
      - run: mix dialyzer
