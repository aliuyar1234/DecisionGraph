name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: mkdir -p .tmp
      - run: uv export --no-hashes --all-extras --format requirements-txt > .tmp/audit-requirements.txt
      - run: grep -v "^-e \.$" .tmp/audit-requirements.txt > .tmp/audit-requirements-no-local.txt
      - run: uv run --with pip-audit pip-audit --strict -r .tmp/audit-requirements-no-local.txt
      - name: Gate on open high/critical Dependabot alerts
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          url = f"https://api.github.com/repos/{repo}/dependabot/alerts?state=open&per_page=100"

          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  alerts = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              if exc.code in {403, 404}:
                  print(
                      "Dependabot alerts API not accessible with current token "
                      f"(HTTP {exc.code}); skipping this gate."
                  )
                  sys.exit(0)
              raise

          high_or_critical = [
              alert
              for alert in alerts
              if alert.get("security_advisory", {}).get("severity")
              in {"high", "critical"}
          ]
          if high_or_critical:
              print(
                  f"Open high/critical Dependabot alerts: {len(high_or_critical)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("No open high/critical Dependabot alerts.")
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with detect-secrets detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
