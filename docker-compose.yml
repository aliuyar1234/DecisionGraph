services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: decisiongraph
      POSTGRES_PASSWORD: decisiongraph
      POSTGRES_DB: decisiongraph_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisiongraph -d decisiongraph_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./beam/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
