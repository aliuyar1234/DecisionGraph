version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: decisiongraph
      POSTGRES_PASSWORD: decisiongraph
      POSTGRES_DB: decisiongraph_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisiongraph -d decisiongraph_test"]
      interval: 5s
      timeout: 5s
      retries: 5
